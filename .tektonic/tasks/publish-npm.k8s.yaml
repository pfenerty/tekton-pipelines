apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tektonic-publish-npm
  namespace: tektonic-ci
spec:
  params:
    - description: Branch or tag ref of the event, bound by PAC from source_branch
      name: source-branch
      type: string
    - name: repo-full-name
      type: string
    - name: revision
      type: string
  stepTemplate:
    computeResources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    workingDir: $(workspaces.workspace.path)
  steps:
    - env:
        - name: NPM_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: npm-token
        - name: NPM_CONFIG_USERCONFIG
          value: $(workspaces.workspace.path)/.npmrc
      image: ghcr.io/pfenerty/apko-cicd/nodejs:22
      name: publish
      onError: continue
      script: |-
        #!/bin/sh
        log() { printf '[%s] %s\n' "$(date +%H:%M:%S)" "$*"; }
        [ -e /tekton/home/.exit-code ] || printf '%s' 0 > /tekton/home/.exit-code
        chmod 0666 /tekton/home/.exit-code 2>/dev/null || true
        (
        set -e
        VERSION=`node -p "require('./package.json').version"`
        TAG_REF="$(params.source-branch)"
        TAG=${TAG_REF#refs/tags/}
        echo "publish-npm: package version $VERSION, tag $TAG"

        # The tag must name the version being published, or a mistagged release would
        # quietly publish whatever happens to be in package.json.
        case "$TAG" in
          "v$VERSION"|"$VERSION") ;;
          *) echo "publish-npm: tag '$TAG' does not match package version '$VERSION'"; exit 1 ;;
        esac

        # Republishing an existing version is an npm error, and re-running a release
        # pipeline is routine — treat "already there" as success.
        if npm view "@pfenerty/tektonic@$VERSION" version >/dev/null 2>&1; then
          echo "publish-npm: $VERSION is already on the registry, nothing to do"
          exit 0
        fi

        if [ ! -d node_modules ]; then npm ci; fi
        npm run build
        printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$NPM_CONFIG_USERCONFIG"
        npm publish --access public
        rm -f "$NPM_CONFIG_USERCONFIG"
        echo "publish-npm: published $VERSION"
        )
        __tek_rc=$?
        if [ "$__tek_rc" -ne 0 ]; then log "error [publish-npm/publish]: exited with status $__tek_rc"; fi
        __tek_prev=$(cat /tekton/home/.exit-code 2>/dev/null || echo 0)
        if [ "$__tek_rc" -gt "$__tek_prev" ]; then __tek_prev="$__tek_rc"; fi
        printf '%s' "$__tek_prev" > /tekton/home/.exit-code
        exit "$__tek_rc"
      workingDir: $(workspaces.workspace.path)
    - env: []
      image: ghcr.io/pfenerty/apko-cicd/base:stable
      name: report-status
      script: |-
        #!/usr/bin/env nu
        def log [msg: string] { print $"[(date now | format date '%H:%M:%S')] ($msg)" }
        let contract_code = (try { open --raw /tekton/home/.exit-code | str trim | into int } catch { 1 })
        # A step that never ran has no file; 0 keeps it out of the max.
        let step_codes = (["/tekton/steps/step-publish/exitCode"] | each { |p| try { open --raw $p | str trim | into int } catch { 0 } })
        let exit_code = ([$contract_code ...$step_codes] | math max)
        let state = if $exit_code == 0 { "success" } else { "failure" }
        let desc = if $exit_code == 0 { "Passed" } else { "Failed" }

        log $"report-status [publish-npm]: exit-code=($exit_code) state=($state)"

        let url = $"https://api.github.com/repos/$(params.repo-full-name)/statuses/$(params.revision)"
        let body = { state: $state, context: "publish-npm", description: $desc }

        log $"report-status [publish-npm]: POST ($url)"
        log $"report-status [publish-npm]: body: ($body | to json -r)"

        try {
          http post $url $body -t application/json -H [
            Authorization $"token ($env.GITHUB_TOKEN)"
            Accept "application/vnd.github+json"
          ]
          log "report-status [publish-npm]: done"
        } catch { |e|
          log $"report-status [publish-npm]: error: ($e.msg)"
        }
        exit $exit_code
  workspaces:
    - name: workspace
